project:
  type: website
  output-dir: _site
  resources:
    - recipe-app.js
    - recipes-index-fr.json
    - recipes-index-en.json

babelquarto:
  mainlanguage: fr
  languages: [en]
  languagelinks: navbar
  languagecodes:
    - name: fr
      text: "Français"
    - name: en
      text: "English"

title-fr: "Cookbook"
title-en: "Cookbook"

website:
  title: "Cookbook"
  site-url: https://antoinelucasfra.github.io/cookbook-web/
  navbar:
    left:
      - href: index.qmd
        text: Cookbook
      - href: browse.qmd
        text: Parcourir
      - href: import.qmd
        text: Importer
  page-footer: "Cuisiné avec [Gram](https://gram-lang.org) + Quarto"

format:
  html:
    theme: cosmo
    lang: fr
    filters:
      - gram
    css:
      - css/gantt.css
      - css/app.css
    include-in-header: _partials/head.html
