<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script>
  // the bundle sits at the language root (site/ or en/); app.css is linked at
  // <lang-root>/css/app.css from every page, so ../ from it is that root
  (function () {
    var css = document.querySelector('link[href$="css/app.css"]');
    if (!css) return;
    var s = document.createElement("script");
    s.src = new URL("../recipe-app.js", new URL(css.getAttribute("href"), document.baseURI)).href;
    s.defer = true;
    document.head.appendChild(s);
  })();
</script>
