name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package built site
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd site/_site
          zip -qr "../../cookbook-web-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "cookbook-web ${GITHUB_REF_NAME}" \
            --generate-notes \
            "cookbook-web-${GITHUB_REF_NAME}.zip"
