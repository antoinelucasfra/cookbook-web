name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - run: npm test
      - run: npm run build

      - name: Package built site
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd site/_site
          zip -qr "../../cookbook-web-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # idempotent: re-pushing a tag must refresh the asset, not fail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "cookbook-web ${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" "cookbook-web-${GITHUB_REF_NAME}.zip" --clobber
